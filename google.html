<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/bcc0f3e22b.js" crossorigin="anonymous"></script>
    <title>Google</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
           /*border: 1px solid black;*/
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        
        }
        .left{
            /*border: 1px solid red;*/
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;

        }
        .right{
            /*border: 1px solid blue;*/
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            
            
        }
        .right img{
            border-radius: 50px;
        }
        a{
            text-decoration: none;
            color: black;
        }
        a:hover{
            text-decoration: underline;
        }
        img{
           /* border: 1px solid red;*/
            text-align: center;

        }
        .search-bar{
            
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border: 1px solid gray;
            width: fit-content;
            border-radius: 25px;
            padding: 0 10px;


        }
        main{
            /*border: 1px solid black;*/
            width: fit-content;
            margin: auto;
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
           
        }
        main img{
            width: 400px;
            /*border: 1px solid;*/
            /*display: flex;
            flex-direction: column;
            justify-content: center;
            align-content: center;*/
          

        }
        main input{
            width: 400px;
            padding: 10px;
            font-size: 18px;
            border: none ;
            outline: none;
            
        }
        .click-search{
            /*border: 1px solid black;*/
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 0 50px;
            gap: 50px;

        }
        .search-button{
             border: 1px solid white;
             background-color:white;
             color: black;
             font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
             font-size: 18px;
             border-radius: 5px;
             
        }
        .Good-feelings{
             border: 1px solid  white;
             background-color: white;
             color: black;
             font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
             font-size: 18px;
             border-radius: 5px;

        }
        
        button:hover{
            cursor:pointer;
            background-color:lightgrey;
        
        }
        .lang{
            /*border: 1px solid red;*/
            padding: 0 100px;


        }
       footer{
        border: 1px solid black;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
            
       }
       .east{
        border: 1px solid blue;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin-bottom: 50px;

       }
       .west{
        border: 1px solid red;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        margin-bottom: 50px;
       }

       
        

    </style>
</head>
<body>
    <header>
        <div class="left">
            <a href="">About</a>
            <a href="">Store</a>
        </div>
        <div class="right">
            <a href="">Gmail</a>
            <a href="">Images</a>
            <i class="fa-solid fa-bars"></i>
            <img src="https://lh3.google.com/u/1/ogw/AF2bZyiIYtMvrvd7r0BJdHUCBxfxRvCMhX-5akO06clMEfGReA=s32-c-mo" srcset="https://lh3.google.com/u/1/ogw/AF2bZyiIYtMvrvd7r0BJdHUCBxfxRvCMhX-5akO06clMEfGReA=s32-c-mo 1x, https://lh3.google.com/u/1/ogw/AF2bZyiIYtMvrvd7r0BJdHUCBxfxRvCMhX-5akO06clMEfGReA=s64-c-mo 2x " alt="">


        </div>
    </header>
    <main>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWJpwUvZMFKp_kXyJA2yd8zulrzNfK4ZIOgQ&s" alt="">
        <div class="search-bar">
        <i class="fa-solid fa-plus"></i>
        <input type="text">
        <i class="fa-solid fa-microphone"></i>
        <i class="fa-regular fa-camera"></i>
        <div class="ai-mode">
            <i class="fa-brands fa-searchengin"></i>
            <span>Ai mode</span>
        </div>  
        </div>
          </div>
          <div class="click-search">
           <button class="search-button">Google Search</button>
                <button class="Good-feelings">I'm Feeling Good</button>  
                </div>

                <div class="lang">
                     <span class="class="offer">Google offered in:</span>
                    <a href=""> हिन्दी </a>
                    <a href=""> हिन्दी </a>
                    <a href="">తెలుగు</a>
                    <a href=""> मराठी </a>
                    <a href=""> தமிழ்</a>
                    <a href=""> ગુજરાતી </a>
                    <a href=""> ಕನ್ನಡ </a>
                    <a href=""> മലയാളം </a>
                    <a href=""> ਪੰਜਾਬੀ</a>
                 
                </div>

    </main>
    <footer>
        <div class="foot">
            <span>India</span>
            <hr>
            <div class="east">
                <a href="">Advertising</a>
                <a href="">Business</a>
                <a href="">How search work</a>
            </div>
            <div class="west"></div>
              <a href="">Privacy</a>
              <a href="">Terms</a>
              <a href="">Settings</a>

            </div>
        </div>

    </footer>
    
</body>
</html>
