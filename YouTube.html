    <title>YouTube</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
     
        header{
            /*border: 1px solid black;*/
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            
        }
        header:hover{
            cursor: pointer;

        }
        .state-bar{
            /*border: 1px solid red;*/
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;   
        }
        .center{
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius:25px;

            
            /* width: 400px;
            border-radius: 20px; */
           
            
        }
         input{
            width: 400px;
            height: 40px;
            border: none;
            text-align: left;

        
            
        }
        /* input placeholder{
           
            border: none; 
        
        }*/
        .fa-solid{
            content:none;
        }
        .right{
          /*  border: 1px solid blue;*/
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        #create{
            padding: 0 10px;
        }
        .right img{
            width: 30px;
            border-radius: 60px;
        }
        button{
            border: 1px solid black;
            background-color: white;
            font-size: 23px;
            width:75px;
            height: 50px;
            border-radius: 22px;
            text-align: left;
            border: none;  
        }
        
        header .right:hover{
            cursor: pointer;

        } 
        .create:hover{
            cursor: pointer;
        }
        header img{
            width: 50px;  
        }
        .button-click{
           border: 1px solid black;
            border-radius: 20px;
            cursor: pointer;    
        }
        #list-items{
          /* border: 1px solid black;*/
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            font-size: 22px;
            top: 50px;
            right: 0;   
        }
        a{
            border: 1px solid black;
            text-decoration: none;
            border-radius: 10px;
            padding: 5px;
            color: black;
            justify-content:right;
            border-color: white;
            position: relative;
            justify-content: space-between;      
        }
        a:hover{
            cursor: pointer;
            background-color: lightgray;
        }
        .top-icon{
           /*border: 1px solid yellow;*/
            display: flex;
            flex-direction: column;  
            width: fit-content;
        }
       .top-icon img{
                 width:20px;
       }
       #phone{
        border: 1px solid black;
        margin-right: 500px;
        border-radius: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-color: white;
       }
       
       #main-video{
       border: 1px solid black;
      
       }
       #video-frame{
        /*border: 1px solid red;*/
        width: fit-content;
        display: flex;
        justify-content: center;

        
       }
       #video-frame img{
        width: 150px;
        height: 100px;

       }
       main{
    background-color: white;
       }
    </style>
