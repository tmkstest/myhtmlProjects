<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            border: 1px solid black;
            height: 90vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
        }
        footer{
            border: 1px solid blue;
            height: 10vh;
        }
        /* body{
            border: 1px solid blue;
            height: 100vh;
        } */
         .left{
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
         }
         .right{
            border: 1px solid red;
         }
         .logo{
            border: 1px solid red;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px;
         }
         .image{
            border: 1px solid  black;
         }
        .logo-img{
            width: 75px;
            height: 75px;
        }
        .logo h1{
            font-size: 54px;
            border: 1px solid black;
            width: 50%;
        }
        .imgage img{
            width: 100%;
            height: 100%;
        }

        
         
    </style>    
</head>
<body>
    <main>
        <div class="left">
        <div class="logo">
            <img class="logo-img" src="images/facebook.png" alt="">
            <h1>Explore the things you love.</h1>
        </div>
        <div class="imgage">
            <img src="images/fbppiture.png" alt="">
        </div>
        </div>
        <div class="right"></div>
    
    </main>
    <footer>

    </footer>

</body>
</html>
